<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatmate | AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Modern Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="brand">
                <div class="logo-icon">CM</div>
                <h1>Chatmate</h1>
            </div>
            <button id="clear-btn" title="Clear Chat History">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                <span>Clear Chat</span>
            </button>
        </header>

        <!-- Chat Display -->
        <main id="chat-window" class="chat-window">
            <!-- Messages load from localStorage via script.js -->
        </main>

        <!-- Input Area -->
        <footer class="footer-container">
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <span>Chatmate is typing...</span>
            </div>

            <form id="chat-form" class="input-wrapper">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Message Chatmate..." 
                    autocomplete="off"
                >
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
